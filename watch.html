<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Cinema - Player</title>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #000000;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e50914;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #e50914;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .back-btn {
            color: #fff;
            text-decoration: none;
            background: #333;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #e50914;
        }
        .player-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .movie-details {
            margin-top: 20px;
            text-align: left;
        }
        .movie-details h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .movie-details p {
            color: #b3b3b3;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">AbsoluteCinema.ge</a>
        <a href="index.html" class="back-btn">← მთავარზე დაბრუნება</a>
    </header>

    <div class="player-container">
        <!-- ვიდეო პლეერი (იუთუბის ან სხვა მედიის ჩასასმელად) -->
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        </div>

        <div class="movie-details">
            <h1 id="movieTitle">ფილმის დასახელება</h1>
            <p>გახმოვანება: <b>MikaDra Dub</b> | ექსკლუზიურად ქართულად</p>
        </div>
    </div>

</body>
</html>
